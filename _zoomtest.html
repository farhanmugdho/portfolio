<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header><div class="bar"><a class="logo" href="#top">FARHAN INTESAR MUGDHO</a><nav><a href="#about">About</a><a href="#skills">Skills</a><a href="#certificates">Certificates</a><a href="#contacts">Contacts</a></nav></div></header>
<main><p style="font-size:16px">Page content</p></main>
<script src="site.js?v=3"></script>
<script>
function report(label){
  var h=document.querySelector('header'),bar=document.querySelector('.bar'),r=h.getBoundingClientRect(),br=bar.getBoundingClientRect(),d=window.devicePixelRatio||1;
  var s='<pre id="out-'+label+'">'+label+' dpr='+d+' innerW='+window.innerWidth+
    ' vars(scale='+document.documentElement.style.getPropertyValue('--nav-scale')+',width='+document.documentElement.style.getPropertyValue('--nav-width')+',pad='+document.documentElement.style.getPropertyValue('--nav-pad')+')'+
    ' headerRect='+r.width.toFixed(1)+'x'+r.height.toFixed(1)+' @'+r.left.toFixed(1)+','+r.top.toFixed(1)+
    ' barRect='+br.width.toFixed(1)+'x'+br.height.toFixed(1)+
    ' visualBarW='+(br.width*d).toFixed(1)+
    ' headerPos='+getComputedStyle(h).position+'</pre>';
  document.body.insertAdjacentHTML('beforeend',s);
}
report('initial');
Object.defineProperty(window,'devicePixelRatio',{value:2,configurable:true});
window.dispatchEvent(new Event('resize'));
report('zoom200');
Object.defineProperty(window,'devicePixelRatio',{value:1.25,configurable:true});
window.dispatchEvent(new Event('resize'));
report('zoom125');
</script>
</body>
</html>
